                - generic [ref=e64]:
                  - text: ANSIEDAD
                  - text: ¿Qué es?
                  - text: Es una sensación de inquietud, preocupación o nerviosismo que sientes en tu cuerpo y mente. Puede aparecer sin razón clara o ante situaciones que te generan incertidumbre.
                  - text: ¿Cómo puede sentirse?
                  - text: "• Taquicardia: tu corazón late más rápido de lo normal, como si estuvieras corriendo sin moverte."
                  - text: "• Tensión muscular: sientes los hombros, cuello o mandíbula apretados durante horas."
                  - text: "• Dificultad para concentrarte: tu mente da vueltas y no puedes enfocarte en una tarea."
                  - text: "• Sensación de ahogo: sientes que respiras más rápido o que el aire no llena bien tus pulmones."
                  - text: Importante
                  - text: La ansiedad es un síntoma, no un diagnóstico. Si persiste o interfiere en tu vida diaria, es importante que hables con un profesional de salud.
