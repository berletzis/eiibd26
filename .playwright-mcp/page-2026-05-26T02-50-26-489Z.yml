                  - text: Diarrea
                  - text: ¿Qué es?
                  - text: Es cuando tienes deposiciones más frecuentes y más blandas o líquidas de lo normal. Significa que el intestino está expulsando las heces más rápido o con menos consistencia.
                  - text: ¿Cómo puede sentirse?
                  - text: • Necesidad urgente de ir al baño varias veces al día.
                  - text: • Heces muy blandas o acuosas que salen sin control.
                  - text: • Sensación de vaciado incompleto o prisa constante.
                  - text: • Malestar o cólicos en el vientre antes de ir al baño.
                  - text: Importante
                  - text: La diarrea es un síntoma, no un diagnóstico. Puede durar horas o días. Si persiste más de una semana, empeora o viene acompañada de otros cambios, es importante que consultes con un médico para saber qué está pasando.
