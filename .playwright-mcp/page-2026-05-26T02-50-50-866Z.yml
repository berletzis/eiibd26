              - paragraph [ref=e66]: "La diarrea es uno de los síntomas más frecuentes en personas con Enfermedad Inflamatoria Intestinal, incluyendo: Colitis Ulcerosa, Enfermedad de Crohn, Colitis Microscópica. Puede presentarse durante un brote activo, pero también puede continuar incluso cuando la enfermedad está en aparente control."
              - generic [ref=e67]:
                - generic [ref=e68]:
                  - heading "Diarrea en Enfermedad Inflamatoria Intestinal (EII)" [level=1] [ref=e69]
                  - paragraph [ref=e70]: "La diarrea es uno de los síntomas más frecuentes en personas con Enfermedad Inflamatoria Intestinal, incluyendo:"
                  - list [ref=e71]:
                    - listitem [ref=e72]:
                      - paragraph [ref=e73]: Colitis Ulcerosa
                    - listitem [ref=e74]:
                      - paragraph [ref=e75]: Enfermedad de Crohn
                    - listitem [ref=e76]:
                      - paragraph [ref=e77]: Colitis Microscópica
                  - paragraph [ref=e78]: Puede presentarse durante un brote activo, pero también puede continuar incluso cuando la enfermedad está en aparente control.
                  - paragraph [ref=e79]: "Esta sección explica:"
                  - list [ref=e80]:
                    - listitem [ref=e81]:
                      - paragraph [ref=e82]: Qué es la diarrea en el contexto de la EII
                    - listitem [ref=e83]:
                      - paragraph [ref=e84]: Por qué ocurre
                    - listitem [ref=e85]:
                      - paragraph [ref=e86]: Qué factores pueden empeorarla
                    - listitem [ref=e87]:
                      - paragraph [ref=e88]: Opciones generales para manejarla
                    - listitem [ref=e89]:
                      - paragraph [ref=e90]: Cuándo buscar atención médica
                  - separator [ref=e91]
                  - heading "¿Qué se considera diarrea?" [level=2] [ref=e92]
                  - paragraph [ref=e93]: "Se considera diarrea cuando:"
                  - list [ref=e94]:
                    - listitem [ref=e95]:
                      - paragraph [ref=e96]: Hay evacuaciones líquidas o muy blandas
                    - listitem [ref=e97]:
                      - paragraph [ref=e98]: Ocurren tres o más veces al día
                    - listitem [ref=e99]:
                      - paragraph [ref=e100]: O son más frecuentes de lo normal para ti
                  - paragraph [ref=e101]: "En EII, la diarrea puede acompañarse de:"
                  - list [ref=e102]:
                    - listitem [ref=e103]:
                      - paragraph [ref=e104]: Moco
                    - listitem [ref=e105]:
                      - paragraph [ref=e106]: Sangre
                    - listitem [ref=e107]:
                      - paragraph [ref=e108]: Urgencia para evacuar
                    - listitem [ref=e109]:
                      - paragraph [ref=e110]: Sensación de evacuación incompleta
                    - listitem [ref=e111]:
                      - paragraph [ref=e112]: Incontinencia
                  - separator [ref=e113]
                  - heading "¿Por qué ocurre la diarrea en la EII?" [level=2] [ref=e114]
                  - paragraph [ref=e115]:
                    - text: El intestino delgado absorbe nutrientes.
                    - text: El colon absorbe agua y forma la materia fecal.
                  - paragraph [ref=e116]: "Cuando existe inflamación:"
                  - list [ref=e117]:
                    - listitem [ref=e118]:
                      - paragraph [ref=e119]: El intestino no absorbe correctamente agua
                    - listitem [ref=e120]:
                      - paragraph [ref=e121]: El tránsito intestinal se acelera
                    - listitem [ref=e122]:
                      - paragraph [ref=e123]: Las evacuaciones se vuelven más líquidas
                  - paragraph [ref=e124]: Pero la inflamación no es la única causa.
                  - separator [ref=e125]
                  - heading "Otras causas posibles de diarrea" [level=2] [ref=e126]
                  - paragraph [ref=e127]: "Aunque la enfermedad esté controlada, pueden existir otros factores:"
                  - heading "1. Efectos secundarios de medicamentos" [level=3] [ref=e128]
                  - paragraph [ref=e129]: Algunos tratamientos utilizados en EII pueden alterar el tránsito intestinal.
                  - paragraph [ref=e130]: Es importante no suspender ningún medicamento sin orientación médica.
                  - separator [ref=e131]
                  - heading "2. Alteraciones después de cirugía intestinal" [level=3] [ref=e132]
                  - paragraph [ref=e133]:
                    - text: Cuando se retira parte del colon, el cuerpo pierde capacidad de absorber agua.
                    - text: Esto puede generar evacuaciones más líquidas y frecuentes.
                  - separator [ref=e134]
                  - heading "3. Malabsorción de ácidos biliares" [level=3] [ref=e135]
                  - paragraph [ref=e136]: Si el íleon está inflamado o fue removido quirúrgicamente, los ácidos biliares pueden irritar el colon y provocar diarrea.
                  - separator [ref=e137]
                  - heading "4. Sobrecrecimiento bacteriano (SIBO)" [level=3] [ref=e138]
                  - paragraph [ref=e139]: "Un exceso de bacterias en el intestino delgado puede provocar:"
                  - list [ref=e140]:
                    - listitem [ref=e141]:
                      - paragraph [ref=e142]: Diarrea
                    - listitem [ref=e143]:
                      - paragraph [ref=e144]: Pérdida de peso
                    - listitem [ref=e145]:
                      - paragraph [ref=e146]: Distensión
                  - separator [ref=e147]
                  - heading "5. Síntomas tipo SII (Síndrome de Intestino Irritable)" [level=3] [ref=e148]
                  - paragraph [ref=e149]: Algunas personas pueden presentar síntomas funcionales incluso cuando la inflamación está controlada.
                  - separator [ref=e150]
                  - heading "6. Infecciones gastrointestinales" [level=3] [ref=e151]
                  - paragraph [ref=e152]: Una infección puede provocar diarrea independientemente de la actividad de la EII.
                  - separator [ref=e153]
                  - heading "7. Estrés" [level=3] [ref=e154]
                  - paragraph [ref=e155]: El eje intestino–cerebro puede influir significativamente en la frecuencia y consistencia de las evacuaciones.
                  - separator [ref=e156]
                  - heading "Manejo general de la diarrea" [level=1] [ref=e157]
                  - paragraph [ref=e158]: El tratamiento depende de la causa.
                  - paragraph [ref=e159]: El primer paso siempre es evaluar si existe inflamación activa.
                  - separator [ref=e160]
                  - heading "Medicamentos antidiarreicos" [level=2] [ref=e161]
                  - paragraph [ref=e162]: "Existen distintos tipos:"
                  - heading "Antimotilidad" [level=3] [ref=e163]
                  - paragraph [ref=e164]: Reducen la velocidad del tránsito intestinal.
                  - paragraph [ref=e165]: ⚠ No deben utilizarse durante brotes severos, fiebre o sangrado activo sin supervisión médica.
                  - separator [ref=e166]
                  - heading "Formadores de volumen" [level=3] [ref=e167]
                  - paragraph [ref=e168]: Absorben agua y pueden ayudar a regular la consistencia.
                  - paragraph [ref=e169]: No se recomiendan si existe estenosis.
                  - separator [ref=e170]
                  - heading "Antiespasmódicos" [level=3] [ref=e171]
                  - paragraph [ref=e172]: Pueden ayudar si existen cólicos o espasmos intestinales.
                  - separator [ref=e173]
                  - heading "Secuestradores de ácidos biliares" [level=3] [ref=e174]
                  - paragraph [ref=e175]: Indicados cuando la diarrea es causada por malabsorción biliar.
                  - separator [ref=e176]
                  - paragraph [ref=e177]: Siempre es importante confirmar con el equipo médico antes de iniciar cualquier tratamiento.
                  - separator [ref=e178]
                  - heading "Alimentación y diarrea" [level=1] [ref=e179]
                  - paragraph [ref=e180]: La alimentación puede influir, pero no siempre es la causa.
                  - paragraph [ref=e181]: Algunas personas identifican alimentos que empeoran sus síntomas. Otras no.
                  - paragraph [ref=e182]: "Es importante:"
                  - list [ref=e183]:
                    - listitem [ref=e184]:
                      - paragraph [ref=e185]: No eliminar grupos completos de alimentos sin orientación profesional
                    - listitem [ref=e186]:
                      - paragraph [ref=e187]: Evitar restricciones innecesarias
                    - listitem [ref=e188]:
                      - paragraph [ref=e189]: Observar patrones individuales
                  - separator [ref=e190]
                  - heading "Factores que pueden empeorar la diarrea en algunas personas:" [level=2] [ref=e191]
                  - list [ref=e192]:
                    - listitem [ref=e193]:
                      - paragraph [ref=e194]: Cafeína
                    - listitem [ref=e195]:
                      - paragraph [ref=e196]: Alcohol
                    - listitem [ref=e197]:
                      - paragraph [ref=e198]: Edulcorantes artificiales
                    - listitem [ref=e199]:
                      - paragraph [ref=e200]: Exceso de grasa
                    - listitem [ref=e201]:
                      - paragraph [ref=e202]: Alimentos muy irritantes
                  - separator [ref=e203]
                  - heading "Fibra" [level=2] [ref=e204]
                  - paragraph [ref=e205]: Si no existe estenosis, no siempre es necesario restringir fibra cuando la enfermedad está controlada.
                  - paragraph [ref=e206]: "Durante brotes, puede ser útil:"
                  - list [ref=e207]:
                    - listitem [ref=e208]:
                      - paragraph [ref=e209]: Consumir verduras cocidas y sin cáscara
                    - listitem [ref=e210]:
                      - paragraph [ref=e211]: Preferir frutas suaves
                    - listitem [ref=e212]:
                      - paragraph [ref=e213]: Reducir fibra insoluble temporalmente
                  - separator [ref=e214]
                  - heading "Lactosa" [level=2] [ref=e215]
                  - paragraph [ref=e216]: Algunas personas pueden desarrollar intolerancia secundaria, especialmente durante brotes.
                  - paragraph [ref=e217]: Antes de eliminar lácteos, es importante confirmar si realmente existe intolerancia.
                  - separator [ref=e218]
                  - heading "Hidratación" [level=1] [ref=e219]
                  - paragraph [ref=e220]: La diarrea incrementa la pérdida de líquidos y electrolitos.
                  - paragraph [ref=e221]: "Es recomendable:"
                  - list [ref=e222]:
                    - listitem [ref=e223]:
                      - paragraph [ref=e224]: Beber pequeñas cantidades frecuentes
                    - listitem [ref=e225]:
                      - paragraph [ref=e226]: Considerar soluciones de rehidratación oral si la diarrea es intensa
                    - listitem [ref=e227]:
                      - paragraph [ref=e228]: Vigilar signos de deshidratación
                  - separator [ref=e229]
                  - heading "Si tienes una ostomía" [level=1] [ref=e230]
                  - paragraph [ref=e231]: El contenido puede ser naturalmente más líquido.
                  - paragraph [ref=e232]: "Puede aumentar si:"
                  - list [ref=e233]:
                    - listitem [ref=e234]:
                      - paragraph [ref=e235]: Existe infección
                    - listitem [ref=e236]:
                      - paragraph [ref=e237]: Se toman ciertos medicamentos
                    - listitem [ref=e238]:
                      - paragraph [ref=e239]: Se consumen alimentos estimulantes
                  - paragraph [ref=e240]: Mantener hidratación es clave.
                  - separator [ref=e241]
                  - heading "Cuidado de la piel" [level=1] [ref=e242]
                  - paragraph [ref=e243]: La diarrea frecuente puede irritar la piel perianal.
                  - paragraph [ref=e244]: "Recomendaciones generales:"
                  - list [ref=e245]:
                    - listitem [ref=e246]:
                      - paragraph [ref=e247]: Limpieza suave con agua tibia
                    - listitem [ref=e248]:
                      - paragraph [ref=e249]: Evitar productos con perfume
                    - listitem [ref=e250]:
                      - paragraph [ref=e251]: Secar sin frotar
                    - listitem [ref=e252]:
                      - paragraph [ref=e253]: Usar protectores cutáneos si es necesario
                    - listitem [ref=e254]:
                      - paragraph [ref=e255]: Preferir ropa interior de algodón
                  - separator [ref=e256]
                  - heading "Olores" [level=1] [ref=e257]
                  - paragraph [ref=e258]: "Si existe preocupación por olores:"
                  - list [ref=e259]:
                    - listitem [ref=e260]:
                      - paragraph [ref=e261]: Ventilar adecuadamente
                    - listitem [ref=e262]:
                      - paragraph [ref=e263]: Utilizar neutralizadores específicos
                    - listitem [ref=e264]:
                      - paragraph [ref=e265]: Recordar que muchas veces somos más sensibles a nuestros propios olores que otras personas
                  - separator [ref=e266]
                  - heading "Cuándo buscar atención médica urgente" [level=1] [ref=e267]
                  - list [ref=e268]:
                    - listitem [ref=e269]:
                      - paragraph [ref=e270]: Fiebre alta
                    - listitem [ref=e271]:
                      - paragraph [ref=e272]: Dolor abdominal intenso
                    - listitem [ref=e273]:
                      - paragraph [ref=e274]: Sangrado abundante
                    - listitem [ref=e275]:
                      - paragraph [ref=e276]: Signos de deshidratación
                    - listitem [ref=e277]:
                      - paragraph [ref=e278]: Distensión severa
                  - separator [ref=e279]
                  - heading "Enfoque EIIBD" [level=2] [ref=e280]
                  - paragraph [ref=e281]: La diarrea no siempre significa que la enfermedad está fuera de control.
                  - paragraph [ref=e282]: "Registrar:"
                  - list [ref=e283]:
